// ---------- Traductor automático de nombres de producto ----------
// Traduce palabra por palabra usando el diccionario de arriba. Preserva sin tocar
// todo lo que no sea una palabra reconocida: marcas, medidas (mm, V, W, kWh),
// códigos de modelo (H07V-K, SDS-Plus, CEM II), y números — porque esos son iguales
// en cualquier idioma. Así, CUALQUIER producto (incluso los generados automáticamente
// por generarVariantes) se traduce solo, sin tener que escribir el nombre en 3 idiomas.
function traducirPalabra(palabra, diccionario) {
  const clave = palabra.toLowerCase();
  const traduccion = diccionario[clave];
  if (!traduccion) return palabra; // no está en el diccionario: se deja igual (marca, código, etc.)
  const primeraMayuscula = palabra[0] !== palabra[0].toLowerCase();
  return primeraMayuscula ? traduccion.charAt(0).toUpperCase() + traduccion.slice(1) : traduccion;
}

function traducirTexto(texto, idioma) {
  if (idioma === "es" || !texto) return texto;
  const diccionario = idioma === "fr" ? DICCIONARIO_FR : DICCIONARIO_EN;
  return texto
    .split(/(\s+|[,()/])/)
    .map((token) => (/^[A-Za-zÀ-ÿ]+$/.test(token) ? traducirPalabra(token, diccionario) : token))
    .join("");
}

// ---------- Generador de variantes ----------
// Crea varios productos a partir de UNA plantilla, cambiando solo el dato que varía
// (calibre, diámetro, potencia, etc). Sirve para escalar el catálogo sin escribir
// cada producto a mano, y es el mismo mecanismo que luego puede leer una lista de
// precios de un proveedor real y generar sus variantes automáticamente.
function generarVariantes({ idBase, pais, cat, sub, marca, nombreTemplate, unidadTemplate, refPrefix, valores }) {
  return valores.map((valor, i) => ({
    id: idBase + i,
    pais,
    cat,
    sub,
    marca,
    nombre: nombreTemplate.replace("{valor}", valor),
    unidad: typeof unidadTemplate === "function" ? unidadTemplate(valor) : unidadTemplate,
    ref: `${refPrefix}-${String(idBase + i).padStart(4, "0")}`,
  }));
}

const PRODUCTOS = [...PRODUCTOS_BASE, ...VARIANTES_GENERADAS];



function PlataformaCotizacion() {
  const [idioma, setIdioma] = React.useState("es");
  const t = T[idioma];
  const [mercado, setMercado] = React.useState("ES");
  const productosDisponibles = React.useMemo(
    () => PRODUCTOS.filter((p) => p.pais === "ambos" || p.pais === mercado),
    [mercado]
  );
  
  // Extraer marcas únicas y ordenarlas alfabéticamente
  const marcasUnicas = React.useMemo(() => {
    const marcas = [...new Set(productosDisponibles.map(p => p.marca))];
    return marcas.sort();
  }, [productosDisponibles]);
  
  // Estado para navegación por marca
  const [marcaSeleccionada, setMarcaSeleccionada] = React.useState(null);
  const [tipoProductoSeleccionado, setTipoProductoSeleccionado] = React.useState(null);
  
  // Productos de la marca seleccionada, agrupados por tipo (subcategoría + nombre base)
  const productosDelaMarca = React.useMemo(() => {
    if (!marcaSeleccionada) return [];
    return productosDisponibles.filter(p => p.marca === marcaSeleccionada);
  }, [marcaSeleccionada, productosDisponibles]);
  
  // Agrupar por "tipo" (nombre sin el valor variable)
  const tiposDeProducto = React.useMemo(() => {
    if (!productosDelaMarca.length) return [];
    const tipos = {};
    productosDelaMarca.forEach(p => {
      const key = p.sub; // Usar subcategoría como agrupador
      if (!tipos[key]) tipos[key] = [];
      tipos[key].push(p);
    });
    // Ordenar variantes de cada tipo de mayor a menor (extrayendo número)
    Object.keys(tipos).forEach(key => {
      tipos[key].sort((a, b) => {
        const numA = parseFloat(a.nombre) || 0;
        const numB = parseFloat(b.nombre) || 0;
        return numB - numA; // Mayor a menor
      });
    });
    return tipos;
  }, [productosDelaMarca]);
  const [busqueda, setBusqueda] = React.useState("");
  const [listaCotizacion, setListaCotizacion] = React.useState({});
  const [panelAbierto, setPanelAbierto] = React.useState(false);
  const [pasoActual, setPasoActual] = React.useState(0);
  const [enviado, setEnviado] = React.useState(false);
  const [catExpandida, setCatExpandida] = React.useState(null);
  const [subActiva, setSubActiva] = React.useState({});

  // ---------- Sistema de cotizaciones: base de datos real en la nube (Firebase) ----------
  // Esto reemplaza el localStorage de antes. Ahora las cotizaciones se guardan en Firestore
  // (la base de datos de Firebase), así que cualquier dispositivo con internet las ve —
  // no solo pestañas del mismo navegador. onSnapshot() escucha cambios en tiempo real:
  // en cuanto tú (admin) respondes una cotización, el cliente la ve actualizarse sola,
  // sin recargar la página, sin importar en qué dispositivo esté.
  const [cotizaciones, setCotizaciones] = React.useState([]);
  React.useEffect(() => {
    const dejarDeEscuchar = db
      .collection("cotizaciones")
      .orderBy("fecha", "desc")
      .onSnapshot(
        (snapshot) => {
          const datos = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
          setCotizaciones(datos);
        },
        (error) => {
          console.error("Error conectando con Firebase:", error);
        }
      );
    return () => dejarDeEscuchar();
  }, []);

  const [misCotizacionesAbierto, setMisCotizacionesAbierto] = React.useState(false);
  const [buscarClienteDato, setBuscarClienteDato] = React.useState("");

  const [proyecto, setProyecto] = React.useState({ tipo: "", zona: "" });
  const [plazo, setPlazo] = React.useState("");
  const [contacto, setContacto] = React.useState({ nombre: "", medio: "", dato: "" });
  const [foto, setFoto] = React.useState(null);
  const [pidiendoExtra, setPidiendoExtra] = React.useState(false);
  const [productoExtra, setProductoExtra] = React.useState("");
  const [extras, setExtras] = React.useState([]);

  function agregarExtra() {
    if (!productoExtra.trim()) return;
    setExtras((prev) => [...prev, productoExtra.trim()]);
    setProductoExtra("");
    setPidiendoExtra(false);
  }

  function quitarExtra(i) {
    setExtras((prev) => prev.filter((_, idx) => idx !== i));
  }

  const buscando = busqueda.trim().length > 0;

  const resultadosBusqueda = React.useMemo(() => {
    if (!buscando) return [];
    const q = busqueda.toLowerCase();
    return productosDisponibles.filter((p) => p.nombre.toLowerCase().includes(q) || p.marca.toLowerCase().includes(q));
  }, [busqueda, buscando, productosDisponibles]);

  const items = Object.entries(listaCotizacion)
    .map(([id, cant]) => {
      const producto = PRODUCTOS.find((p) => p.id === Number(id));
      return producto ? { ...producto, cantidad: cant } : null;
    })
    .filter(Boolean);

  const totalItems = items.reduce((acc, i) => acc + i.cantidad, 0);

  function agregar(id) {
    setListaCotizacion((prev) => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
  }

  function cambiarCantidad(id, delta) {
    setListaCotizacion((prev) => {
      const nueva = (prev[id] || 0) + delta;
      if (nueva <= 0) {
        const { [id]: _, ...resto } = prev;
        return resto;
      }
      return { ...prev, [id]: nueva };
    });
  }

  function abrirFlujo() {
    setPasoActual(0);
    setPanelAbierto(true);
    setMarcaSeleccionada(null);
    setTipoProductoSeleccionado(null);
  }

  function siguientePaso() {
    setPasoActual((p) => Math.min(p + 1, PASOS.length - 1));
  }

  function pasoAnterior() {
    setPasoActual((p) => Math.max(p - 1, 0));
  }

  function enviarSolicitud() {
    const nuevaCotizacion = {
      fecha: new Date().toISOString(),
      proyecto: { ...proyecto },
      plazo,
      contacto: { ...contacto },
      items: items.map((i) => ({ id: i.id, nombre: i.nombre, marca: i.marca, unidad: i.unidad, cantidad: i.cantidad })),
      extras: [...extras],
      estado: "enviada", // enviada -> respondida -> aceptada -> pagada
      precioTotal: null,
      notasAdmin: "",
    };
    db.collection("cotizaciones")
      .add(nuevaCotizacion)
      .catch((error) => console.error("Error guardando cotización en Firebase:", error));
    setEnviado(true);
    setTimeout(() => {
      setEnviado(false);
      setListaCotizacion({});
      setProyecto({ tipo: "", zona: "" });
      setPlazo("");
      setContacto({ nombre: "", medio: "", dato: "" });
      setFoto(null);
      setExtras([]);
      setPanelAbierto(false);
    }, 2800);
  }

  function aceptarCotizacion(id) {
    db.collection("cotizaciones").doc(id).update({ estado: "aceptada" })
      .catch((error) => console.error("Error aceptando cotización:", error));
  }

  function pagarCotizacion(id) {
    // DEMO: aquí es donde se conectaría Stripe/PayPal en producción.
    // Por ahora simula el pago exitoso para mostrar el flujo completo.
    db.collection("cotizaciones").doc(id).update({ estado: "pagada" })
      .catch((error) => console.error("Error registrando el pago:", error));
  }

  const puedeAvanzar = [
    proyecto.tipo && proyecto.zona.trim(),
    items.length > 0 || extras.length > 0,
    plazo,
    contacto.nombre.trim() && contacto.dato.trim() && (contacto.direccion || "").trim() && (contacto.cp || "").trim(),
    true,
  ];

  return (
    <div style={{ fontFamily: F_BODY, background: COLOR.fondo, minHeight: "100vh", color: COLOR.grafito, paddingBottom: 90 }}>
      {/* ---------- Barra superior ---------- */}
      <header
        style={{
          background: COLOR.grafito,
          color: COLOR.fondo,
          padding: "16px 20px",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 14, maxWidth: 980, margin: "0 auto" }}>
          <div style={{ fontFamily: F_DISPLAY, fontWeight: 900, fontSize: 24, letterSpacing: 0.3, whiteSpace: "nowrap" }}>
            OBRA<span style={{ color: COLOR.amarillo }}>MARKET</span>
          </div>
          <div style={{ flex: 1, position: "relative" }}>
            <input
              value={busqueda}
              onChange={(e) => {
                setBusqueda(e.target.value);
                if (e.target.value.trim()) {
                  setMarcaSeleccionada(null);
                  setTipoProductoSeleccionado(null);
                }
              }}
              placeholder={t.buscarPlaceholder}
              style={{
                width: "100%",
                padding: "11px 14px",
                border: "none",
                borderRadius: 8,
                fontSize: 14.5,
                outline: "none",
                background: COLOR.tarjeta,
                color: COLOR.grafito,
                boxSizing: "border-box",
              }}
            />
          </div>
          <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
            {IDIOMAS.map((i) => (
              <button
                key={i.id}
                onClick={() => setIdioma(i.id)}
                style={{
                  padding: "7px 10px",
                  fontSize: 12,
                  fontWeight: 800,
                  borderRadius: 6,
                  border: "none",
                  cursor: "pointer",
                  background: idioma === i.id ? COLOR.amarillo : "rgba(237,228,211,0.15)",
                  color: idioma === i.id ? COLOR.grafito : COLOR.fondo,
                }}
              >
                {i.etiqueta}
              </button>
            ))}
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 4, maxWidth: 980, margin: "8px auto 0" }}>
          {MERCADOS.map((m) => (
            <button
              key={m.id}
              onClick={() => setMercado(m.id)}
              style={{
                padding: "6px 10px",
                fontSize: 12,
                fontWeight: 700,
                borderRadius: 6,
                border: `1px solid ${mercado === m.id ? COLOR.amarillo : "rgba(237,228,211,0.25)"}`,
                cursor: "pointer",
                background: mercado === m.id ? "rgba(245,183,0,0.15)" : "transparent",
                color: COLOR.fondo,
              }}
            >
              {m.etiqueta}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, maxWidth: 980, margin: "8px auto 0" }}>
          <button
            onClick={() => setMisCotizacionesAbierto(true)}
            style={{
              padding: "6px 10px",
              fontSize: 11.5,
              fontWeight: 700,
              borderRadius: 6,
              border: "1px solid rgba(237,228,211,0.25)",
              cursor: "pointer",
              background: "transparent",
              color: COLOR.fondo,
            }}
          >
            📋 {idioma === "es" ? "Mis Cotizaciones" : idioma === "fr" ? "Mes Devis" : "My Quotes"}
          </button>
        </div>
      </header>

      {/* ---------- Hero cálido con fondo dinámico ---------- */}
      {!buscando && (
        <div
          style={{
            position: "relative",
            overflow: "hidden",
            background: `linear-gradient(135deg, ${COLOR.ladrillo} 0%, #7a2c10 60%, ${COLOR.grafito} 130%)`,
            color: COLOR.fondo,
            padding: "36px 20px 30px",
            textAlign: "center",
          }}
        >
          {/* Patrón diagonal tipo cinta de obra, sin depender de imágenes externas */}
          <div
            style={{
              position: "absolute",
              inset: 0,

              backgroundImage: `repeating-linear-gradient(45deg, ${COLOR.amarillo} 0, ${COLOR.amarillo} 18px, transparent 18px, transparent 36px)`,
            }}
          />
          <div style={{ position: "relative", maxWidth: 560, margin: "0 auto" }}>
            <div style={{ fontFamily: F_DISPLAY, fontSize: 28, fontWeight: 900, lineHeight: 1.15, marginBottom: 8 }}>
              {t.heroTitulo}

            <p style={{ fontSize: 14, color: "#F3DCC8", margin: 0 }}>
              {t.heroTexto}
            </p>
          </div>
        </div>
      )}

      {/* ---------- Menú de categorías tipo acordeón ---------- */}
      {!buscando && !marcaSeleccionada && (
        <div style={{ maxWidth: 980, margin: "0 auto", padding: "16px 16px 0" }}>
          {CATEGORIAS.map((c) => (
            <CategoriaAcordeon
              key={c.id}
              categoria={c}

              abierta={catExpandida === c.id}

              onToggle={() => setCatExpandida(catExpandida === c.id ? null : c.id)}
              onElegirSub={(s) => setSubActiva((prev) => ({ ...prev, [c.id]: s }))}
              productos={productosDisponibles.filter(
                (p) => p.cat === c.id && ((subActiva[c.id] || "todas") === "todas" || p.sub === (subActiva[c.id] || "todas"))

          ))}
        </div>
      )}

      {/* ---------- Sección Por Marcas ---------- */}
      {!buscando && !marcaSeleccionada && (
        <div style={{ maxWidth: 980, margin: "20px auto 0", padding: "0 16px" }}>

                  textAlign: "center",
                  transition: "all 0.2s",
                  ":hover": { borderColor: COLOR.amarillo, background: "rgba(245,183,0,0.05)" },
                }}
                onMouseEnter={(e) => {
                  e.target.style.borderColor = COLOR.amarillo;
                  e.target.style.background = "rgba(245,183,0,0.05)";
                }}
                onMouseLeave={(e) => {
                  e.target.style.borderColor = COLOR.borde;
                  e.target.style.background = COLOR.tarjeta;
                }}
              >
                {marca}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* ---------- Vista de Marca Seleccionada: Tipos de Producto ---------- */}
      {!buscando && marcaSeleccionada && !tipoProductoSeleccionado && (
        <div style={{ maxWidth: 980, margin: "0 auto", padding: "20px 16px" }}>
          <button
            onClick={() => setMarcaSeleccionada(null)}
            style={{
              padding: "8px 12px",
              fontSize: 12,
              fontWeight: 700,
              borderRadius: 6,
              border: "none",
              background: COLOR.grafito,
              color: COLOR.fondo,
              cursor: "pointer",
              marginBottom: 14,
            }}
          >
            ← {idioma === "es" ? "Volver a Marcas" : idioma === "fr" ? "Retour aux Marques" : "Back to Brands"}
          </button>
          <div style={{ fontSize: 18, fontWeight: 900, fontFamily: F_DISPLAY, color: COLOR.grafito, marginBottom: 16 }}>
            {marcaSeleccionada}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 14 }}>
            {Object.entries(tiposDeProducto).map(([tipo, productos]) => (
              <button
                key={tipo}
                onClick={() => setTipoProductoSeleccionado(tipo)}
                style={{
                  padding: 16,
                  borderRadius: 10,
                  border: `2px solid ${COLOR.borde}`,
                  background: COLOR.tarjeta,
                  cursor: "pointer",
                  textAlign: "left",
                  transition: "all 0.2s",
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.borderColor = COLOR.amarillo;
                  e.currentTarget.style.background = "rgba(245,183,0,0.08)";
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.borderColor = COLOR.borde;
                  e.currentTarget.style.background = COLOR.tarjeta;
                }}
              >
                <div style={{ fontWeight: 700, fontSize: 14, color: COLOR.grafito, marginBottom: 6 }}>
                  {traducirTexto(tipo, idioma)}
                </div>
                <div style={{ fontSize: 12, color: COLOR.grafitoSuave }}>
                  {productos.length} {productos.length === 1 ? traducirTexto("producto", idioma) : traducirTexto("productos", idioma)}
                </div>
              </button>
            ))}
          </div>
        </div>
      )}

      {/* ---------- Vista de Tipo Seleccionado: Modelos Ordenados Mayor a Menor ---------- */}
      {!buscando && marcaSeleccionada && tipoProductoSeleccionado && (
        <div style={{ maxWidth: 980, margin: "0 auto", padding: "20px 16px" }}>
          <button
            onClick={() => setTipoProductoSeleccionado(null)}
            style={{
              padding: "8px 12px",
              fontSize: 12,
              fontWeight: 700,
              borderRadius: 6,
              border: "none",
              background: COLOR.grafito,
              color: COLOR.fondo,
              cursor: "pointer",
              marginBottom: 14,
            }}
          >
            ← {idioma === "es" ? "Volver a " + marcaSeleccionada : idioma === "fr" ? "Retour à " + marcaSeleccionada : "Back to " + marcaSeleccionada}
          </button>
          <div style={{ fontSize: 18, fontWeight: 900, fontFamily: F_DISPLAY, color: COLOR.grafito, marginBottom: 4 }}>
            {marcaSeleccionada}
          </div>
          <div style={{ fontSize: 14, color: COLOR.grafitoSuave, marginBottom: 16 }}>
            {traducirTexto(tipoProductoSeleccionado, idioma)}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 12 }}>
            {tiposDeProducto[tipoProductoSeleccionado]?.map((p) => (
              <ProductoCard
                key={p.id}
                producto={p}
                t={t}
                idioma={idioma}
                cantidad={listaCotizacion[p.id] || 0}
                onAgregar={() => agregar(p.id)}
                onCambiar={(delta) => cambiarCantidad(p.id, delta)}
              />
            ))}
          </div>
        </div>
      )}

      {/* ---------- Resultados de búsqueda ---------- */}
      {buscando ? (
        <div style={{ maxWidth: 980, margin: "0 auto", padding: "20px 16px" }}>
          <div style={{ fontSize: 13.5, color: COLOR.grafitoSuave, marginBottom: 12 }}>
            {t.resultadosPara(resultadosBusqueda.length, busqueda)}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 12 }}>
            {resultadosBusqueda.map((p) => (
              <ProductoCard
                key={p.id}
                producto={p}
                t={t}
                idioma={idioma}
                cantidad={listaCotizacion[p.id] || 0}
                onAgregar={() => agregar(p.id)}
                onCambiar={(delta) => cambiarCantidad(p.id, delta)}
              />
            ))}
            {resultadosBusqueda.length === 0 && (
              <div style={{ gridColumn: "1 / -1", padding: 30, textAlign: "center", color: COLOR.grafitoSuave }}>
                {t.sinResultados(busqueda)}
              </div>
            )}
          </div>
        </div>
      ) : null}

      {/* ---------- No lo encuentras ---------- */}
      {!buscando && (
        <div style={{ maxWidth: 980, margin: "0 auto", padding: "6px 16px 20px" }}>
          <div
            style={{
              background: COLOR.grafito,
              color: COLOR.fondo,
              borderRadius: 12,
              padding: "18px 16px",
              textAlign: "center",
            }}
          >
            <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>{t.noEncuentrasTitulo}</div>
            <p style={{ fontSize: 13, color: "#CFC5B6", margin: "0 0 12px" }}>
              {t.noEncuentrasTexto}
            </p>
            {!pidiendoExtra ? (
              <button
                onClick={() => setPidiendoExtra(true)}
                style={{ background: COLOR.amarillo, color: COLOR.grafito, border: "none", borderRadius: 8, padding: "10px 18px", fontWeight: 800, fontSize: 13.5, cursor: "pointer" }}
              >
                {t.pedirProducto}
              </button>
            ) : (
              <div style={{ display: "flex", gap: 8, maxWidth: 420, margin: "0 auto" }}>
                <input
                  value={productoExtra}
                  onChange={(e) => setProductoExtra(e.target.value)}
                  placeholder={t.placeholderExtra}
                  style={{ flex: 1, padding: "10px 12px", borderRadius: 8, border: "none", fontSize: 13.5 }}
                />
                <button onClick={agregarExtra} style={{ background: COLOR.amarillo, color: COLOR.grafito, border: "none", borderRadius: 8, padding: "10px 14px", fontWeight: 800, cursor: "pointer" }}>
                  {t.anadir}
                </button>
              </div>
            )}
            {extras.length > 0 && (
              <div style={{ marginTop: 12, display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center" }}>
                {extras.map((e, i) => (
                  <span key={i} style={{ background: "rgba(245,183,0,0.15)", border: `1px solid ${COLOR.amarillo}`, borderRadius: 999, padding: "5px 10px", fontSize: 12, display: "flex", alignItems: "center", gap: 6 }}>
                    {e}
                    <span onClick={() => quitarExtra(i)} style={{ cursor: "pointer", fontWeight: 800 }}>×</span>
                  </span>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* ---------- Botón flotante de lista ---------- */}
      {(totalItems > 0 || extras.length > 0) && (
        <button
          onClick={abrirFlujo}
          style={{
            position: "fixed",
            bottom: 18,
            left: "50%",
            transform: "translateX(-50%)",
            background: COLOR.amarillo,
            color: COLOR.grafito,
            border: "none",
            borderRadius: 999,
            padding: "14px 26px",
            fontWeight: 800,
            fontSize: 15,
            cursor: "pointer",
            boxShadow: "0 6px 18px rgba(43,36,32,0.35)",
            zIndex: 30,
          }}
        >
          {t.solicitarCotizacion(totalItems + extras.length)}
        </button>
      )}

      {/* ---------- Panel del flujo de cotización ---------- */}
      {panelAbierto && (
        <div onClick={() => setPanelAbierto(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 40 }}>
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              position: "absolute",
              right: 0,
              top: 0,
              bottom: 0,
              width: "min(440px, 92vw)",
              background: COLOR.fondo,
              display: "flex",
              flexDirection: "column",
              boxShadow: "-6px 0 20px rgba(0,0,0,0.3)",
            }}
          >
            <div style={{ padding: "16px 18px", background: COLOR.grafito, color: COLOR.fondo }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <strong style={{ fontFamily: F_DISPLAY, fontSize: 18 }}>{t.tituloPanel}</strong>
                <button
                  onClick={() => setPanelAbierto(false)}
                  style={{ background: "none", border: "none", color: COLOR.fondo, fontSize: 22, cursor: "pointer" }}
                  aria-label="Cerrar"
                >
                  ×
                </button>
              </div>
              {!enviado && (
                <div style={{ display: "flex", gap: 4 }}>
                  {PASOS.map((_, i) => (
                    <div key={i} style={{ flex: 1, height: 4, borderRadius: 2, background: i <= pasoActual ? COLOR.amarillo : "rgba(237,228,211,0.25)" }} />
                  ))}
                </div>
              )}
            </div>

            {enviado ? (
              <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 30, textAlign: "center" }}>
                <div>
                  <div style={{ fontSize: 42, marginBottom: 10 }}>✓</div>
                  <div style={{ fontWeight: 800, fontSize: 17, marginBottom: 6 }}>{t.enviadoTitulo}</div>
                  <div style={{ fontSize: 13.5, color: COLOR.grafitoSuave }}>
                    {t.enviadoTexto}
                  </div>
                </div>
              </div>
            ) : (
              <>
                <div style={{ flex: 1, overflowY: "auto", padding: 18 }}>
                  {PASOS[pasoActual] === "proyecto" && <PasoProyecto proyecto={proyecto} setProyecto={setProyecto} t={t} />}
                  {PASOS[pasoActual] === "materiales" && <PasoMateriales items={items} onCambiar={cambiarCantidad} extras={extras} t={t} idioma={idioma} />}
                  {PASOS[pasoActual] === "plazo" && <PasoPlazo plazo={plazo} setPlazo={setPlazo} t={t} />}
                  {PASOS[pasoActual] === "contacto" && <PasoContacto contacto={contacto} setContacto={setContacto} t={t} />}
                  {PASOS[pasoActual] === "foto" && <PasoFoto foto={foto} setFoto={setFoto} t={t} />}
                </div>

                <div style={{ padding: 16, borderTop: `2px solid ${COLOR.grafito}`, display: "flex", gap: 10 }}>
                  {pasoActual > 0 && (
                    <button
                      onClick={pasoAnterior}
                      style={{ flex: "0 0 auto", background: "transparent", border: `1px solid ${COLOR.grafito}`, color: COLOR.grafito, padding: "12px 16px", fontWeight: 700, fontSize: 14, borderRadius: 8, cursor: "pointer" }}
                    >
                      {t.atras}
                    </button>
                  )}
                  {pasoActual < PASOS.length - 1 ? (
                    <button
                      disabled={!puedeAvanzar[pasoActual]}
                      onClick={siguientePaso}
                      style={{ flex: 1, background: puedeAvanzar[pasoActual] ? COLOR.amarillo : COLOR.borde, color: COLOR.grafito, border: "none", padding: "12px 16px", fontWeight: 800, fontSize: 14, borderRadius: 8, cursor: puedeAvanzar[pasoActual] ? "pointer" : "not-allowed" }}
                    >
                      {t.continuar}
                    </button>
                  ) : (
                    <button
                      onClick={enviarSolicitud}
                      style={{ flex: 1, background: COLOR.amarillo, color: COLOR.grafito, border: "none", padding: "12px 16px", fontWeight: 800, fontSize: 14, borderRadius: 8, cursor: "pointer" }}
                    >
                      {t.enviarSolicitud}
                    </button>
                  )}
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* ---------- Panel: Mis Cotizaciones (vista del cliente) ---------- */}
      {misCotizacionesAbierto && (
        <div onClick={() => setMisCotizacionesAbierto(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 40 }}>
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              position: "absolute",
              right: 0,
              top: 0,
              bottom: 0,
              width: "min(440px, 92vw)",
              background: COLOR.fondo,
              display: "flex",
              flexDirection: "column",
              boxShadow: "-6px 0 20px rgba(0,0,0,0.3)",
            }}
          >
            <div style={{ padding: "16px 18px", background: COLOR.grafito, color: COLOR.fondo, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <strong style={{ fontFamily: F_DISPLAY, fontSize: 18 }}>
                {idioma === "es" ? "Mis Cotizaciones" : idioma === "fr" ? "Mes Devis" : "My Quotes"}
              </strong>
              <button onClick={() => setMisCotizacionesAbierto(false)} style={{ background: "none", border: "none", color: COLOR.fondo, fontSize: 22, cursor: "pointer" }}>×</button>
            </div>
            <div style={{ padding: 18, borderBottom: `1px solid ${COLOR.borde}` }}>
              <FieldLabel>{idioma === "es" ? "Busca por tu teléfono o correo" : idioma === "fr" ? "Recherchez par téléphone ou e-mail" : "Search by phone or email"}</FieldLabel>
              <Campo value={buscarClienteDato} onChange={setBuscarClienteDato} placeholder={t.datoPlaceholder} />
            </div>
            <div style={{ flex: 1, overflowY: "auto", padding: 18 }}>
              {buscarClienteDato.trim() === "" ? (
                <div style={{ textAlign: "center", color: COLOR.grafitoSuave, fontSize: 13, padding: 30 }}>
                  {idioma === "es" ? "Ingresa el dato de contacto que usaste al enviar tu cotización." : idioma === "fr" ? "Entrez le contact que vous avez utilisé pour votre devis." : "Enter the contact info you used to submit your quote."}
                </div>
              ) : (
                cotizaciones
                  .filter((c) => c.contacto.dato.toLowerCase().includes(buscarClienteDato.trim().toLowerCase()))
                  .map((c) => (
                    <div key={c.id} style={{ border: `1px solid ${COLOR.borde}`, borderRadius: 10, padding: 14, marginBottom: 12, background: COLOR.tarjeta }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                        <span style={{ fontSize: 12, color: COLOR.grafitoSuave }}>{new Date(c.fecha).toLocaleDateString()}</span>
                        <EstadoBadge estado={c.estado} idioma={idioma} />
                      </div>
                      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>
                        {c.items.length} {c.items.length === 1 ? "producto" : "productos"}{c.extras.length > 0 ? ` + ${c.extras.length} fuera de catálogo` : ""}
                      </div>
                      <div style={{ fontSize: 12, color: COLOR.grafitoSuave, marginBottom: 8 }}>{c.proyecto.zona}</div>

                      {c.estado === "enviada" && (
                        <div style={{ fontSize: 12.5, color: COLOR.grafitoSuave, fontStyle: "italic" }}>
                          {idioma === "es" ? "Esperando respuesta con el precio…" : idioma === "fr" ? "En attente du prix…" : "Waiting for price…"}
                        </div>
                      )}

                      {(c.estado === "respondida" || c.estado === "aceptada" || c.estado === "pagada") && (
                        <div style={{ borderTop: `1px solid ${COLOR.borde}`, paddingTop: 8, marginTop: 4 }}>
                          <div style={{ fontSize: 20, fontWeight: 900, color: COLOR.ladrillo, fontFamily: F_DISPLAY }}>
                            {c.precioTotal} €
                          </div>
                          {c.notasAdmin && <div style={{ fontSize: 12, color: COLOR.grafitoSuave, marginTop: 4 }}>{c.notasAdmin}</div>}
                        </div>
                      )}

                      {c.estado === "respondida" && (
                        <button
                          onClick={() => aceptarCotizacion(c.id)}
                          style={{ marginTop: 10, width: "100%", padding: "10px 12px", background: COLOR.amarillo, color: COLOR.grafito, border: "none", borderRadius: 8, fontWeight: 800, fontSize: 13, cursor: "pointer" }}
                        >
                          {idioma === "es" ? "Aceptar cotización" : idioma === "fr" ? "Accepter le devis" : "Accept quote"}
                        </button>
                      )}

                      {c.estado === "aceptada" && (
                        <button
                          onClick={() => pagarCotizacion(c.id)}
                          style={{ marginTop: 10, width: "100%", padding: "10px 12px", background: COLOR.grafito, color: COLOR.fondo, border: "none", borderRadius: 8, fontWeight: 800, fontSize: 13, cursor: "pointer" }}
                        >
                          💳 {idioma === "es" ? "Pagar ahora" : idioma === "fr" ? "Payer maintenant" : "Pay now"}
                        </button>
                      )}

                      {c.estado === "pagada" && (
                        <div style={{ marginTop: 10, textAlign: "center", fontSize: 13, fontWeight: 800, color: "#2E7D32" }}>
                          ✓ {idioma === "es" ? "Pagado" : idioma === "fr" ? "Payé" : "Paid"}
                        </div>
                      )}
                    </div>
                  ))
              )}
              {buscarClienteDato.trim() !== "" && cotizaciones.filter((c) => c.contacto.dato.toLowerCase().includes(buscarClienteDato.trim().toLowerCase())).length === 0 && (
                <div style={{ textAlign: "center", color: COLOR.grafitoSuave, fontSize: 13, padding: 30 }}>
                  {idioma === "es" ? "No encontramos cotizaciones con ese dato." : idioma === "fr" ? "Aucun devis trouvé." : "No quotes found."}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

// ---------- Acordeón de categoría con subcategorías ----------

function CategoriaAcordeon({ categoria, idioma, t, abierta, subActiva, onToggle, onElegirSub, productos, listaCotizacion, onAgregar, onCambiar }) {
  const subsMostrados = categoria.subs[idioma];
  const subsInternos = categoria.subs.es;
  return (
    <div style={{ marginBottom: 10, border: `1px solid ${COLOR.borde}`, borderRadius: 12, overflow: "hidden", background: COLOR.tarjeta }}>
      <button
        onClick={onToggle}
        style={{
          width: "100%",
          display: "flex",
          alignItems: "center",
          gap: 12,
          padding: "14px 16px",
          background: abierta ? COLOR.grafito : COLOR.tarjeta,
          color: abierta ? COLOR.fondo : COLOR.grafito,
          border: "none",
          cursor: "pointer",
          textAlign: "left",
        }}
      >
        <span style={{ fontSize: 22 }}>{categoria.icono}</span>
        <span style={{ fontFamily: F_DISPLAY, fontSize: 16, fontWeight: 900, flex: 1 }}>{categoria.nombre[idioma]}</span>
        <span style={{ fontSize: 12, color: abierta ? COLOR.amarillo : COLOR.grafitoSuave, fontWeight: 700 }}>
          {productos.length > 0 ? `${productos.length}` : ""}
        </span>
        <span style={{ fontSize: 16, transform: abierta ? "rotate(180deg)" : "none", transition: "transform 0.15s" }}>▾</span>
      </button>

      {abierta && (
        <div style={{ padding: "12px 14px 16px" }}>
          <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 10 }}>
            <SubPill activo={subActiva === "todas"} onClick={() => onElegirSub("todas")}>
              {t.todas}
            </SubPill>
            {subsMostrados.map((s, i) => (
              <SubPill key={s} activo={subActiva === subsInternos[i]} onClick={() => onElegirSub(subsInternos[i])}>
                {s}
              </SubPill>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10 }}>
            {productos.map((p) => (
              <ProductoCard
                key={p.id}
                producto={p}
                t={t}
                idioma={idioma}
                onAgregar={() => onAgregar(p.id)}
                cantidad={listaCotizacion[p.id] || 0}
                onCambiar={(delta) => onCambiar(p.id, delta)}
              />
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function SubPill({ children, activo, onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        flexShrink: 0,
        padding: "6px 12px",
        borderRadius: 999,
        border: `1px solid ${activo ? COLOR.ladrillo : COLOR.borde}`,
        background: activo ? COLOR.ladrillo : "transparent",
        color: activo ? "#fff" : COLOR.grafitoSuave,
        fontSize: 12,
        fontWeight: 700,
        cursor: "pointer",
        whiteSpace: "nowrap",
      }}
    >
      {children}
    </button>
  );
}

function ProductoCard({ producto, cantidad, onAgregar, onCambiar, t, idioma }) {
  return (
    <div style={{ background: COLOR.tarjeta, border: `1px solid ${COLOR.borde}`, borderRadius: 10, overflow: "hidden", height: "100%", display: "flex", flexDirection: "column" }}>
      <div
        style={{
          height: 54,
          background: COLOR.grafito,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          color: COLOR.amarillo,
          fontSize: 12,
          fontWeight: 800,
          letterSpacing: 0.3,
          textAlign: "center",
          padding: "0 6px",
        }}
      >
        {producto.marca}
      </div>
      <div style={{ padding: 10, display: "flex", flexDirection: "column", flex: 1 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: COLOR.grafito, marginBottom: 3, lineHeight: 1.3 }}>
          {traducirTexto(producto.nombre, idioma)}
        </div>
        <div style={{ fontSize: 11, color: COLOR.grafitoSuave, marginBottom: 10 }}>
          {traducirTexto(producto.unidad, idioma)} · {t.ref} {producto.ref}
        </div>
        {cantidad === 0 ? (
          <button
            onClick={onAgregar}
            style={{
              marginTop: "auto",
              background: COLOR.ladrillo,
              color: "#fff",
              border: "none",
              borderRadius: 8,
              padding: "8px 10px",
              fontSize: 12,
              fontWeight: 700,
              cursor: "pointer",
            }}
          >
            {t.agregar}
          </button>
        ) : (
          <div style={{ marginTop: "auto", display: "flex", alignItems: "center", justifyContent: "space-between", background: COLOR.fondo, borderRadius: 8, padding: "4px 8px" }}>
            <QtyBtn onClick={() => onCambiar(-1)}>–</QtyBtn>
            <span style={{ fontSize: 13, fontWeight: 800 }}>{cantidad}</span>
            <QtyBtn onClick={() => onCambiar(1)}>+</QtyBtn>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Pasos del flujo ----------

function PasoProyecto({ proyecto, setProyecto, t }) {
  return (
    <div>
      <StepTitle numero={1} titulo={t.paso1Titulo} t={t} />
      <FieldLabel>{t.tipoProyecto}</FieldLabel>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
        {t.tipos.map((tp) => (
          <OpcionRadio key={tp} seleccionado={proyecto.tipo === tp} onClick={() => setProyecto({ ...proyecto, tipo: tp })}>
            {tp}
          </OpcionRadio>
        ))}
      </div>
      <FieldLabel>{t.zonaLabel}</FieldLabel>
      <Campo placeholder={t.zonaPlaceholder} value={proyecto.zona} onChange={(v) => setProyecto({ ...proyecto, zona: v })} />
    </div>
  );
}

function PasoMateriales({ items, onCambiar, extras, t, idioma }) {
  return (
    <div>
      <StepTitle numero={2} titulo={t.paso2Titulo} t={t} />
      {items.length === 0 && extras.length === 0 && (
        <p style={{ color: COLOR.grafitoSuave, fontSize: 14, textAlign: "center", marginTop: 20 }}>
          {t.listaVacia}
        </p>
      )}
      {items.map((item) => (
        <div key={item.id} style={{ display: "flex", justifyContent: "space-between", gap: 10, padding: "12px 0", borderBottom: `1px solid ${COLOR.borde}` }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13.5, fontWeight: 700 }}>{traducirTexto(item.nombre, idioma)}</div>
            <div style={{ fontSize: 12, color: COLOR.grafitoSuave, marginTop: 2 }}>{traducirTexto(item.unidad, idioma)}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <QtyBtn onClick={() => onCambiar(item.id, -1)}>–</QtyBtn>
            <span style={{ fontSize: 13, minWidth: 18, textAlign: "center" }}>{item.cantidad}</span>
            <QtyBtn onClick={() => onCambiar(item.id, 1)}>+</QtyBtn>
          </div>
        </div>
      ))}
      {extras.length > 0 && (
        <div style={{ marginTop: 12 }}>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: COLOR.grafitoSuave, marginBottom: 6 }}>{t.fueraCatalogo}</div>
          {extras.map((e, i) => (
            <div key={i} style={{ fontSize: 13.5, fontWeight: 600, padding: "8px 0", borderBottom: `1px solid ${COLOR.borde}` }}>
              {e}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function PasoPlazo({ plazo, setPlazo, t }) {
  return (
    <div>
      <StepTitle numero={3} titulo={t.paso3Titulo} t={t} />
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {t.plazos.map((o) => (
          <OpcionRadio key={o} seleccionado={plazo === o} onClick={() => setPlazo(o)}>
            {o}
          </OpcionRadio>
        ))}
      </div>
    </div>
  );
}

function PasoContacto({ contacto, setContacto, t }) {
  return (
    <div>
      <StepTitle numero={4} titulo={t.paso4Titulo} t={t} />
      <FieldLabel>{t.nombreLabel}</FieldLabel>
      <Campo value={contacto.nombre} onChange={(v) => setContacto({ ...contacto, nombre: v })} placeholder={t.nombrePlaceholder} />
      <FieldLabel>{t.medioLabel}</FieldLabel>
      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        {t.medios.map((m) => (
          <button
            key={m}
            onClick={() => setContacto({ ...contacto, medio: m })}
            style={{
              flex: 1,
              padding: "9px 6px",
              fontSize: 12.5,
              fontWeight: 700,
              borderRadius: 8,
              border: `1px solid ${contacto.medio === m ? COLOR.grafito : COLOR.borde}`,
              background: contacto.medio === m ? COLOR.grafito : COLOR.tarjeta,
              color: contacto.medio === m ? COLOR.fondo : COLOR.grafito,
              cursor: "pointer",
            }}
          >
            {m}
          </button>
        ))}
      </div>
      <FieldLabel>{t.datoLabel}</FieldLabel>
      <Campo value={contacto.dato} onChange={(v) => setContacto({ ...contacto, dato: v })} placeholder={t.datoPlaceholder} />
      <FieldLabel>{t.direccionLabel}</FieldLabel>
      <Campo value={contacto.direccion || ""} onChange={(v) => setContacto({ ...contacto, direccion: v })} placeholder={t.direccionPlaceholder} />
      <FieldLabel>{t.cpLabel}</FieldLabel>
      <Campo value={contacto.cp || ""} onChange={(v) => setContacto({ ...contacto, cp: v })} placeholder={t.cpPlaceholder} />
    </div>
  );
}

function PasoFoto({ foto, setFoto, t }) {
  return (
    <div>
      <StepTitle numero={5} titulo={t.paso5Titulo} t={t} />
      <p style={{ fontSize: 13, color: COLOR.grafitoSuave, marginBottom: 14 }}>
        {t.fotoTexto}
      </p>
      <label
        style={{
          display: "block",
          border: `2px dashed ${COLOR.borde}`,
          borderRadius: 12,
          padding: "26px 14px",
          textAlign: "center",
          cursor: "pointer",
          fontSize: 13,
          color: COLOR.grafitoSuave,
          background: COLOR.tarjeta,
        }}
      >
        {foto ? t.fotoSeleccionada(foto) : t.subirImagen}
        <input type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => setFoto(e.target.files?.[0]?.name || null)} />
      </label>
    </div>
  );
}

function StepTitle({ numero, titulo, t }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontSize: 11.5, color: COLOR.grafitoSuave, fontWeight: 700, marginBottom: 2 }}>{t.pasoDe(numero)}</div>
      <div style={{ fontFamily: F_DISPLAY, fontSize: 18, fontWeight: 900, color: COLOR.grafito }}>{titulo}</div>
    </div>
  );
}

function EstadoBadge({ estado, idioma }) {
  const config = {
    enviada: { color: "#7A6F62", bg: "rgba(122,111,98,0.12)", label: { es: "Enviada", fr: "Envoyé", en: "Sent" } },
    respondida: { color: "#B5451B", bg: "rgba(181,69,27,0.12)", label: { es: "Respondida", fr: "Répondu", en: "Quoted" } },
    aceptada: { color: "#F5B700", bg: "rgba(245,183,0,0.18)", label: { es: "Aceptada", fr: "Accepté", en: "Accepted" } },
    pagada: { color: "#2E7D32", bg: "rgba(46,125,50,0.12)", label: { es: "Pagada", fr: "Payé", en: "Paid" } },
  };
  const c = config[estado] || config.enviada;
  return (
    <span style={{ fontSize: 11, fontWeight: 800, padding: "3px 9px", borderRadius: 20, background: c.bg, color: c.color }}>
      {c.label[idioma] || c.label.es}
    </span>
  );
}

function FieldLabel({ children }) {
  return <div style={{ fontSize: 12.5, fontWeight: 700, color: COLOR.grafito, marginBottom: 6 }}>{children}</div>;
}

function OpcionRadio({ children, seleccionado, onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        textAlign: "left",
        padding: "11px 12px",
        borderRadius: 8,
        border: `1px solid ${seleccionado ? COLOR.grafito : COLOR.borde}`,
        background: seleccionado ? COLOR.grafito : COLOR.tarjeta,
        color: seleccionado ? COLOR.fondo : COLOR.grafito,
        fontSize: 13.5,
        fontWeight: 700,
        cursor: "pointer",
      }}
    >
      {children}
    </button>
  );
}

function Campo({ placeholder, value, onChange }) {
  return (
    <input
      value={value}
      onChange={(e) => onChange(e.target.value)}
      placeholder={placeholder}
      style={{
        width: "100%",
        padding: "10px 11px",
        marginBottom: 8,
        border: `1px solid ${COLOR.borde}`,
        borderRadius: 8,
        fontSize: 13.5,
        boxSizing: "border-box",
      }}
    />
  );
}

function QtyBtn({ children, onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        width: 24,
        height: 24,
        border: `1px solid ${COLOR.borde}`,
        borderRadius: 6,
        background: "#fff",
        cursor: "pointer",
        fontSize: 14,
        lineHeight: 1,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
      }}
    >
      {children}
    </button>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PlataformaCotizacion />);
</script>
</body>
</html>
